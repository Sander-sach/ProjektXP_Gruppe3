<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <title>Edit Movie</title>
    <link rel="stylesheet" href="/css/general.css">
    <link rel="stylesheet" href="/css/movieForms.css">
    <script type=module src="js/editMovie.js"></script>
</head>
<body>

<a href="/index.html" class="back-link">&larr; Back to front page</a>

<div class="input-section">
    <h2>Edit Movie</h2>
    <p>Movie Titel</p>
    <input type="text"
           id="movieTitle">

    <p>Description</p>
    <textarea
            id="movieDescription"
            placeholder="Movie description"></textarea>

    <p>Genre</p>
    <select id="genreSelect">
    </select>

    <p>Age Limit</p>
    <select id="ageLimitSelect">
    </select>

    <p>Duration</p>
    <input type="text"
           id="duration"
           placeholder="Movie Duration">

    <button id="updateMovieConfirmation" class="confirmButton">Update Movie</button>
</div>


</body>
</html>
