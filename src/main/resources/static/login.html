<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Medarbejder-Login</title>
    <link rel="stylesheet" href="css/loginStyle.css">
</head>
<body>
    <div class="split-layout">
        <div class="split-right">
            <div class="form-box">
                <h2>Log ind</h2>

                <form method="post">
                    <div class="form-group">
                        <label>Brugernavn</label>
                        <input type="text" name="username" placeholder="Indtast brugernavn">
                    </div>

                    <div class="form-group">
                        <label>Adgangskode</label>
                        <input type="password" name="password" placeholder="Indtast adgangskode">
                    </div>

                    <div class="form-group">
                        <button class="btn btn-primary" type="submit">Log ind</button>
                    </div>
                </form>

                <div style="text-align: center; margin-top: 1rem;">
                    <button id="registerBtn">Opret ny Bruger</button>
                    <dialog id="registerDialog">
                        <form method="post">
                            <h2>Bruger oprettelse</h2>
                            <label for="userName">Brugernavn</label>
                            <input type="userName" id="userName" name="userName" required>
                            <label for="password">Adgangskode</label>
                            <input type="password" id="password" name="password" required>
                            <menu>
                            <button type="button" id="cancelBtn">Annuller</button>
                            <button type="submit">Register</button>
                            </menu>
                        </form>
                    </dialog>
                </div>
            </div>
        </div>
        <div class="split-left">
            <h1>Medarbejder Login</h1>
        </div>
    </div>
<script src="/js/login.js"></script>
</body>
</html>
