<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <title>Create Movie</title>
    <link rel="stylesheet" href="/css/general.css">
    <link rel="stylesheet" href="/css/movieForms.css">
    <script type=module src="js/createMovie.js"></script>
</head>
<body>

<a href="/employee-tools.html" class="back-link">&larr; Back to front page</a>

<h1>Create Movie</h1>

<div class="input-section">

    <p>Movie Titel</p>
    <input type="text"
           id="movieTitle"
           placeholder="Movie Title">

    <p>Description</p>
    <textarea
            id="movieDescription"
            placeholder="Movie description"></textarea>

    <p>Genre</p>
    <select id="genreSelect">
        <option value="">All Genres</option>
    </select>

    <p>Age Limit</p>

    <select id="ageLimitSelect">
        <option value="">Age limit</option>
    </select>

    <p>Duration</p>
    <input type="text"
           id="duration"
           placeholder="Movie Duration">
    <button id="createMovieConfirmation" class="confirmButton">Create Movie</button>
</div>


</body>
</html>
