services:
  db:
    image: mysql:8
    environment:
      MYSQL_DATABASE: bioproject
      MYSQL_ROOT_PASSWORD: secret
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 10
  app:
    build: .
    ports:
     - "8080:8080"
    depends_on:
        db:
          condition: service_healthy
    environment:
        SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/bioproject
        SPRING_DATASOURCE_USERNAME: root
        SPRING_DATASOURCE_PASSWORD: secret
volumes:
  db-data: